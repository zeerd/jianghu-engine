; ============================================================
; 任务脚本骨架 —— 只写 Triger 部分，其余节留空占位
; 生成后请用 GBK(936) 编码保存，否则客户端乱码
; 用法：复制本模板，按接任务 NPC 的任务流程填 [TrigerSet_*]
; ============================================================

[Setting]
TrigerSetNum=100
TrigerShareNum=100
Name=$Name
ID=$ID

; ---------- 空占位（按需启用） ----------
[PreCmd]
PreCmd_Num=1
PreCmd_Delay=1
PreCmd_1=$t1

[Seek]
Seek_Num=0

[Enemys]
Enemys_Num=0

[Goods]
Goods_Num=0

; ============================================
; 分区编号 N 从 1 连续；组内编号 M 从 1 递增
; KEY      = 接任务瞬间玩家看到的原文（* 通配，| 多选一）
; TrigerNum= 分区触发条数上限（预留），惯例 100
; ============================================

[TrigerSet_1]
KEY=接任务NPC的关键台词，可变部分用*。|你设置环境变量：任务 为 开始。
TrigerNum=100

; 第一条 Msg 必须包含 KEY 的文字，命令写启动动作
[Triger1_1]
Msg=接任务NPC的关键台词，可变部分用*。|你设置环境变量：任务 为 开始。
Cmd=!has 战斗场景,/flee;!go 目的地房间名;
Obj=;
Tmr=500

; 途经/失败兜底
[Triger1_2]
Msg=找不到从此处到*的路径。
Cmd=/trans 1;
Obj=;
Tmr=500

; 到达判定（!go 完成的回显）
[Triger1_3]
Msg=已经到达目的地房间名|你进入了目的地房间名。
Cmd=!t 目标NPC的id,/ask 参数;
Obj=;
Tmr=600
Tlp=1

; 交互结果（台词来自数据集 say/tell_object 原文，可变部分换 *）
[Triger1_4]
Msg=目标NPC:台词的固定部分*。
Cmd=!set 任务 下一阶段;
Obj=;
Tmr=500
Tlp=1

; ============================================
; 下一个任务分支：KEY 命中上一步 !set 产生的回显
; ============================================
[TrigerSet_2]
KEY=你设置环境变量：任务 为 下一阶段。
TrigerNum=100

[Triger2_1]
Msg=你设置环境变量：任务 为 下一阶段。
Cmd=!go 下一个房间名;
Obj=;
Tmr=500

; 杀任务示例：目标不固定时用 Enemys 列表（--）
[Triger2_2]
Msg=已经到达下一个房间名|你进入了下一个房间名。
Cmd=/kill;
Obj=--;
Tmr=500
Tlp=1

; 击杀完成 → 回去交任务
[Triger2_3]
Msg=*死了。|*完成了任务。
Cmd=!t 接任务NPC的id,/report;
Obj=;
Tmr=600
Tlp=1

; 交任务回执（奖励文案，数字换 *）
[Triger2_4]
Msg=你获得了*点经验*。
Cmd=!set 任务 开始;
Obj=;
Tmr=500
