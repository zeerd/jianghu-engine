; lua-sample 单人 E2E 集成测试专用服务器配置
; ---------------------------------------------------------------------------
; 由 tests\integration\run_sample_e2e.ps1 使用：通过服务端命令行参数
; `jianghu.exe --config tests\integration\config.ini` 直接加载，
; 不再临时改写 data/config.ini（服务端默认仍读取 data/config.ini）。
;
; 因此这里的路径都相对于工作目录（仓库根）；脚本以仓库根为工作目录启动服务器。
;
; 与常规 data/config.ini 的差异：
;   - [database] name   ：独立测试库，避免污染业务库（服务端会自动建库建表）
;   - [server]   port   ：独立端口，避免与开发服务冲突
;   - [server]   start_room = 青云山山脚（lua-sample 的起始房间）
;   - [lua]      script_root = lua-sample，默认目录仍由 lua-default 兜底

[log]
; 日志级别：TRACE / DEBUG / INFO / WARN / ERROR / FATAL
level = info
; 日志文件存放目录（相对于工作目录）
path = log

[database]
host = 127.0.0.1
user = root
password = root
; 独立测试库（服务端启动时会 CREATE DATABASE IF NOT EXISTS）
name = game_e2e_sample

[server]
port = 6601
name = 金剑江湖
id = 1
; lua-sample 的起始房间
start_room = 青云山山脚
; 每个 IP 地址允许的最大同时连接数
ip_limit = 30
high_force_max_effect = 1
force_add_hp = 0
no_force_conflict = 0
force_no_need_prepare = 0
no_betrayer_valid = 0
newlife_no_conflict = 1
; E2E 指令完全由剧本节奏控制，关闭 16 条/5 秒边界限流，
; 避免边界随机丢弃指令造成 wait 超时的不确定性
rate_limit = 0

[lua]
; 用户脚本目录：lua-sample（被测样本）
script_root = lua-sample
; 服务器自带默认脚本目录（同名脚本被用户目录覆盖）
default_script_root = lua-default

[party]
max_members = 4
share_exp = true
auto_follow_fight = true
couple_level_diff = 10
