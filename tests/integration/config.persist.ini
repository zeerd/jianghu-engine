; persist 试验台服务器配置（run-integration-tests.ps1 的并发中间重启机制）
; ---------------------------------------------------------------------------
; 与主配置 tests\integration\config.ini 的差异只有两处：
;   - [server]   port   = 6612（与主服 6611 并行互不干扰）
;   - [database] path   = tests/integration/e2e_persist.db（独立库：
;     跨重启持久化的就是这份库——挑战计数落 t_npc，两次试验台实例先后
;     打开同一文件，主套件的 e2e.db 与它完全隔离）
;
; 试验台生命周期由 run-integration-tests.ps1 的后台任务驱动，按
; 「跑段 → 停服 → 重启 → 跑下段」的 N 段循环执行（本次两段：
; persist_pre → 重启 → persist_post），全程与各道并行。
;
; 其余段落与 config.ini 保持一致（路径同样相对仓库根，服务器以仓库根为
; 工作目录启动）。改动主配置时请同步本文件。

[log]
; 日志级别：TRACE / DEBUG / INFO / WARN / ERROR / FATAL
level = info
; 日志文件存放目录（相对于工作目录）——与主服同目录，但 --log-run-id 不同
; （主服 <runid>、试验台 <runid>-pt），各落各的文件，字节偏移扫描一并覆盖
path = tests/integration/log

[database]
; 独立 SQLite 文件库：与主套件的 e2e.db 互不读写
type = sqlite
path = tests/integration/e2e_persist.db

[server]
port = 6612
name = 金剑江湖
id = 1
; lua-sample 的起始房间
start_room = 青云山山脚
; 每个 IP 地址允许的最大同时连接数
ip_limit = 30
high_force_max_effect = 1
force_add_hp = 0
no_force_conflict = 0
force_no_need_prepare = 0
no_betrayer_valid = 0
newlife_no_conflict = 1
; E2E 指令完全由剧本节奏控制，关闭 16 条/5 秒边界限流，
; 避免边界随机丢弃指令造成 wait 超时的不确定性
rate_limit = 0
; 新角色初始年龄：取 16 以越过住宅区购房年龄门槛
start_age = 16

[lua]
; 用户脚本目录：lua-sample（被测样本）
script_root = lua-sample
; 服务器自带默认脚本目录（同名脚本被用户目录覆盖）
default_script_root = lua-default

[party]
max_members = 4
share_exp = true
auto_follow_fight = true
couple_level_diff = 10
