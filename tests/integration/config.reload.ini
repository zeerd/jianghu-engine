; 热重载试验台专用服务器配置（run-integration-tests.ps1 的 reload 试验台）
; ---------------------------------------------------------------------------
; 与 tests\integration\config.ini 的差异（独立端口/独立库/私有脚本副本）：
;   - [server]   port   = 6613：独立端口，与主服 6611、persist 试验台 6612 错开
;   - [database] path   = test_tmp\e2e_reload\e2e.db：每轮由 reload_testbed.ps1
;                         删除重建，首登必落 start_room，巫师账号开机自举
;   - [lua]      script_root = test_tmp\e2e_reload/scripts：lua-sample 的
;                         每轮私有副本（reload_testbed.ps1 复制 + 覆盖 fixture
;                         A 变体）——剧本的 filecopy/filedelete 只允许写这里，
;                         教材 lua-sample 与生产 lua-default 全程只读
;
; 路径都相对于工作目录（仓库根）；服务器以仓库根为工作目录启动。

[log]
; 日志级别：TRACE / DEBUG / INFO / WARN / ERROR / FATAL
level = info
; 与主套件同目录：run-integration-tests.ps1 的日志增量扫描按目录快照，
; 本试验台经 --log-run-id <id>-rl 单独成文件，自动纳入扫描与白名单判定
path = tests/integration/log

[database]
type = sqlite
path = test_tmp/e2e_reload/e2e.db

[server]
port = 6613
name = 金剑江湖
id = 1
; fixture 起始房间同名顶替：登录即达，剧本无需行走
start_room = 青云山山脚
ip_limit = 30
high_force_max_effect = 1
force_add_hp = 0
no_force_conflict = 0
force_no_need_prepare = 0
no_betrayer_valid = 0
newlife_no_conflict = 1
; E2E 指令完全由剧本节奏控制，关闭限流（理由同 config.ini）
rate_limit = 0
start_age = 16

[lua]
; 每轮私有副本（lua-sample + fixture A 变体），剧本在其中切换 B/损坏变体
script_root = test_tmp/e2e_reload/scripts
; 服务器自带默认脚本目录：生产只读，不参与自动热重载（fromDefault 跳过）
default_script_root = lua-default

[party]
max_members = 4
share_exp = true
auto_follow_fight = true
couple_level_diff = 10
