; tests 测试专用配置文件 —— sample 世界变体
; 与 test_config.ini 的唯一差别是 [lua] script_root：本配置把 lua-sample
; 当作脚本根（与集测 config.ini 同口径），供需要样例世界的套件使用。
; run-unit-tests.ps1 按套件分组装箱，把本文件换进 sample 组分片的
; tests\unit\test_config.ini；同一分片内的套件必须同组，否则会串根。
; 路径相对于仓库根目录

[log]
level = trace
; 测试日志目录（相对仓库根；测试只能从仓库根运行，故落到 tests\log\）
; 与服务器日志 <仓库根>\log\ 分离，见 .gitignore 的 /tests/log/
path = tests/unit/log

[database]
host = 127.0.0.1
user = root
password = root
name = test

[server]
port = 6600
name = 测试服务器
id = 1
start_room = 青云山山脚
ip_limit = 30
high_force_max_effect = 1
force_add_hp = 0
no_force_conflict = 0
force_no_need_prepare = 0
no_betrayer_valid = 0

[lua]
; 样例世界脚本目录（本配置由 run-unit-tests.ps1 换进 sample 组的分片）
script_root = lua-sample
; 默认脚本目录（同名脚本被用户目录覆盖）
default_script_root = lua-default
